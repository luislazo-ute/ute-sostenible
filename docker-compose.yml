services:
  base_datos:
    image: postgres:18
    container_name: ute_sostenible_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    restart: unless-stopped

  odoo:
    image: odoo:19
    container_name: ute_sostenible_odoo
    depends_on:
      - base_datos
    ports:
      - "8069:8069"
    environment:
      HOST: base_datos
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - datos_odoo:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf 
      - ./addons:/mnt/extra-addons
    restart: unless-stopped

volumes:
  datos_postgres:
  datos_odoo:
